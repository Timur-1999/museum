<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Louvre</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Forum&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="body">
        <header class="header">
            <div class="cotainer">
                <div class="nav">
                <div class="logo">
                    <img class="svg_logo" src="assets/svg/logo.svg" alt="page_logo">
                    <span id="txt_logo">Louvre</span>
                </div>
                <div class="menu">
                    <ul class="menu_items">
                        <li class="menu_item">Visiting</li>
                        <li class="menu_item">Explore</li>
                        <li class="menu_item">Video</li>
                        <li class="menu_item">Gallery</li>
                        <li class="menu_item">Tickets</li>
                        <li class="menu_item">Contacts</li>
                    </ul>                    
                </div>
                </div>
            </div>
        </header>
        <main class="main">
            <section class="Welcome">
                <div class="cotainer">
                    <div class="main_block_welcome">
                        <div class="main_descr">
                            <div class="title">
                                Welcome <br> to the Louvre
                            </div>
                            <div class="subtitle">
                                From the castle to the museum
                            </div>
                            <div class="btn_welcome">
                                <span>Discover the Louvre</span>
                            </div>
                        </div>
                        <div class="main_block_img">
                            <div class="block_img">
                                <img src="assets/img/Monalisa.png" alt="Monalisa">
                            </div>
                            <div class="main_block_slider">
                                <div class="block_slider">
                                <div class="block_num_pages">
                                    <span class="cur_num_page">01</span>
                                    <span class="line">|</span>
                                    <span class="all_num_page">05</span>
                                </div>
                                <div class="slider_position">
                                    <span class="slid_positon_item slid_active_item"></span>
                                    <span class="slid_positon_item"></span>
                                    <span class="slid_positon_item"></span>
                                    <span class="slid_positon_item"></span>
                                    <span class="slid_positon_item"></span>
                                </div>
                                <div class="scroll_arrows">
                                    <img class="arrow_back" src="assets/svg/left-arrow.svg" alt="Left Arrow">
                                    <img class="arrow_next" src="assets/svg/right-arrow.svg" alt="Right Arrow">
                                </div>
                            </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
            <section class="Visiting"></section>
            <section class="Explore"></section>
            <section class="Video"></section>
            <section class="Gallery"></section>
            <section class="Tickets"></section>
            <section class="Contacts"></section>
        </main>
        <footer class="footer">

        </footer>
</body>
</html>
